name: lst_resshift
phase: train
gpu_ids: [0]
seed: 2026

path:
  log: logs
  tb_logger: tb_logger
  results: results
  checkpoint: checkpoint
  resume_state: null

datasets:
  normalization_stats: ${SCRATCH}/lst-super-resolution/normalization_stats.json
  train:
    dataroot: ${SCRATCH}/lst-super-resolution/prithvi_data
    batch_size: 64
    num_workers: 8
    use_shuffle: true
    data_len: -1
  val:
    data_len: 50
    seed: 2026
  test:
    dataroot: ${SCRATCH}/lst-super-resolution/prithvi_data
    data_len: -1

model:
  which_model_G: resshift
  unet:
    in_channel: 2
    out_channel: 1
    inner_channel: 64
    norm_groups: 16
    channel_multiplier: [1, 2, 4, 8, 16]
    attn_res: [14]
    res_blocks: 2
    dropout: 0
  resshift:
    kappa: 1.0
    loss_type: l2
  beta_schedule:
    train:
      schedule: exponential
      n_timestep: 15
      schedule_power: 0.3
      etas_end: 0.99
      min_noise_level: 0.04
    test:
      schedule: exponential
      n_timestep: 15
      schedule_power: 0.3
      etas_end: 0.99
      min_noise_level: 0.04
  diffusion:
    image_size: 224
    channels: 1
    conditional: true

train:
  n_iter: 300000
  val_freq: 5000
  save_checkpoint_freq: 5000
  print_freq: 200
  warmup_steps: 5000
  optimizer:
    lr: 5.0e-5
  ema_scheduler:
    step_start_ema: 5000
    update_ema_every: 1
    ema_decay: 0.9999

wandb:
  project: lst_sr3
